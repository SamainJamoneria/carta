<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Efectos Temporada - Jamonería Samaín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 300vh; /* Altura generosa para hacer scroll fluido */
            background: linear-gradient(to bottom, #f5f7fa, #c3cfe2);
        }

        header {
            background-color: #1a252f;
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #detalle-temporada {
            margin-top: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1c40f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .contenido {
            padding: 60px 20px;
            text-align: center;
            color: #333;
        }

        /* CORRECCIÓN DE POSICIÓN Y ANIMACIÓN DE CAÍDA Y DESAPARICIÓN */
        .particula-scroll {
            position: fixed; /* Fijo a la ventana para que caigan por encima de todo el contenido */
            pointer-events: none;
            z-index: 9999;
            animation: animarCaida linear forwards;
            will-change: transform, opacity;
        }

        @keyframes animarCaida {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 1; /* Aparecen suavemente al empezar a caer */
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.1);
                opacity: 0; /* Se desvanecen por completo al llegar abajo */
            }
        }
    </style>
</head>
<body class="modo-navidad">

    <header>
        <h1>Jamonería Samaín - Vista Previa</h1>
        <!-- Contenedor del banner superior -->
        <div id="detalle-temporada"></div>
    </header>

    <div class="contenido">
        <h2>👇 Mueve la rueda del ratón hacia abajo (Haz Scroll)</h2>
        <p>Verás cómo las partículas de Navidad se distribuyen por toda la pantalla, caen girando y desaparecen solas.</p>
        <br><br><br>
        <p>Sigue haciendo scroll...</p>
        <br><br><br><br><br>
        <p>¡El efecto se repite de forma fluida mientras bajas!</p>
    </div>

    <script>
        // ==========================================
        // 7. EFECTOS DE TEMPORADA AUTOMÁTICOS
        // ==========================================
        const body = document.body;
        const detalleEl = document.getElementById("detalle-temporada");

        const obtenerEsIngles = () => document.documentElement.lang === "en";

        // Usamos Data URIs temporales con gráficos limpios para la prueba visual inmediata
        const configuracionTemporadas = {
            "modo-navidad": {
                icono: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='none' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z'/><circle cx='12' cy='10' r='3'/></svg>",
                textos: {
                    es: "Felices Fiestas de parte del equipo de Samaín",
                    en: "Merry Christmas from the Samaín team"
                },
                particulas: [
                    // Bola roja navideña simulada en SVG
                    "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24'><circle cx='12' cy='14' r='8' fill='%23e74c3c'/><path d='M10 4h4v3h-4z' fill='%23bdc3c7'/><path d='M12 2v2' stroke='%23bdc3c7' stroke-width='2'/></svg>",
                    // Copo / Estrella simulada
                    "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='%233498db'><path d='M12 2L15 9H22L16 14L18 21L12 17L6 21L8 14L2 9H9L12 2Z'/></svg>"
                ]
            }
        };

        const modoActivo = "modo-navidad";

        if (modoActivo && configuracionTemporadas[modoActivo]) {
            const config = configuracionTemporadas[modoActivo];
            
            const actualizarTextoTemporada = () => {
                if (detalleEl) {
                    const idiomaActual = obtenerEsIngles() ? "en" : "es";
                    detalleEl.innerHTML = "";

                    const archivoIcono = config.icono;

                    if (archivoIcono) {
                        const imgIcono = document.createElement("img");
                        imgIcono.src = archivoIcono;
                        imgIcono.alt = "Icono temporada";
                        imgIcono.style.height = "1.4em";
                        imgIcono.style.verticalAlign = "middle";
                        detalleEl.appendChild(imgIcono);
                    }

                    const textoSpan = document.createElement("span");
                    textoSpan.textContent = config.textos[idiomaActual];
                    detalleEl.appendChild(textoSpan);
                }
            };

            actualizarTextoTemporada();

            let ultimoScroll = window.scrollY;
            let contadorScroll = 0;

            window.addEventListener("scroll", () => {
                const scrollActual = window.scrollY;

                // Detectar movimiento hacia abajo
                if (scrollActual > ultimoScroll) {
                    contadorScroll++;
                    // Cada 2 eventos de scroll genera una partícula para que se aprecie bien el flujo
                    if (contadorScroll % 2 === 0) {
                        crearParticulaScroll(config.particulas);
                    }
                }
                ultimoScroll = scrollActual;
            }, { passive: true });

            function crearParticulaScroll(listaRecursos) {
                const recurso = listaRecursos[Math.floor(Math.random() * listaRecursos.length)];
                
                const particula = document.createElement("img");
                particula.src = recurso;
                particula.className = "particula-scroll";
                particula.alt = "Partícula";

                // Posición horizontal aleatoria en todo el ancho de la ventana
                const posX = Math.random() * (window.innerWidth - 50);
                const tamano = Math.floor(Math.random() * 20) + 25; // Entre 25px y 45px
                const duracion = Math.floor(Math.random() * 800) + 1200; // Entre 1.2s y 2s de caída

                particula.style.left = `${posX}px`;
                particula.style.top = `-60px`; // Empiezan justo por encima de la pantalla
                particula.style.width = `${tamano}px`;
                particula.style.height = "auto";
                particula.style.animationDuration = `${duracion}ms`;

                document.body.appendChild(particula);

                // Se borra exactamente al terminar la animación para liberar memoria
                setTimeout(() => particula.remove(), duracion);
            }
        }
    </script>
</body>
</html>
