<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Efectos Temporada - Jamonería Samaín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 300vh; /* Altura generosa para hacer scroll fluido */
            background: linear-gradient(to bottom, #f5f7fa, #c3cfe2);
        }

        header {
            background-color: #1a252f;
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Contenedor del detalle de temporada en la cabecera */
        .detalle-temporada {
            display: none; /* Oculto por defecto el resto del año */
            margin: 12px auto 0;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            width: fit-content;
            align-items: center;
            gap: 8px;
        }

        /* Modos específicos para el banner de la cabecera */
        body.modo-navidad .detalle-temporada {
            display: inline-flex;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        body.modo-sanjuan .detalle-temporada {
            display: inline-flex;
            background: rgba(243, 156, 18, 0.15);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.4);
        }

        body.modo-carnaval .detalle-temporada {
            display: inline-flex;
            background: rgba(253, 121, 168, 0.15);
            color: #fd79a8;
            border: 1px solid rgba(253, 121, 168, 0.4);
        }

        body.modo-samain .detalle-temporada {
            display: inline-flex;
            background: rgba(230, 126, 34, 0.15);
            color: #e67e22;
            border: 1px solid rgba(230, 126, 34, 0.4);
        }

        .contenido {
            padding: 60px 20px;
            text-align: center;
            color: #333;
        }

        /* Partículas flotantes de scroll con caída completa */
        .particula-scroll {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: caidaParticula linear forwards;
            will-change: transform, opacity;
        }

        @keyframes caidaParticula {
            0% {
                opacity: 0;
                transform: translateY(-50px) scale(0.8) rotate(0deg);
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) scale(1.1) rotate(360deg);
            }
        }
    </style>
</head>
<body class="modo-navidad"> <!-- Cambia a modo-sanjuan, modo-carnaval o modo-samain para probar otras -->

    <header>
        <h1>Jamonería Samaín - Vista Previa</h1>
        <!-- Contenedor del banner superior con su clase CSS correspondiente -->
        <div id="detalle-temporada" class="detalle-temporada"></div>
    </header>

    <div class="contenido">
        <h2>👇 Mueve la rueda del ratón hacia abajo (Haz Scroll)</h2>
        <p>Verás las imágenes reales de tu carpeta img/ cayendo y desapareciendo por la pantalla.</p>
        <br><br><br>
        <p>Sigue haciendo scroll...</p>
        <br><br><br><br><br>
        <p>¡El efecto se repite de forma fluida mientras bajas!</p>
    </div>

    <script>
        // ==========================================
        // 7. EFECTOS DE TEMPORADA AUTOMÁTICOS
        // ==========================================
        const body = document.body;
        const detalleEl = document.getElementById("detalle-temporada");

        const obtenerEsIngles = () => document.documentElement.lang === "en";

        // Configuración completa con tus archivos reales en la carpeta img/
        const configuracionTemporadas = {
            "modo-navidad": {
                icono: "santa.png",
                textos: {
                    es: "Felices Fiestas de parte del equipo de Samaín",
                    en: "Merry Christmas from the Samaín team"
                },
                particulas: ["bola_roja.png", "bola_amarilla.png", "bola_azul.png"]
            },
            "modo-sanjuan": {
                icono: "fuego.png",
                textos: {
                    es: "¡Llega la mágica Noche de San Juan!",
                    en: "Celebrating San Juan"
                },
                particulas: ["ascuas.png"]
            },
            "modo-carnaval": {
                icono: "bufon.png",
                textos: {
                    es: "¡Feliz Carnaval!",
                    en: "Happy Carnival Season!"
                },
                particulas: ["bufon.png", "mascara.png", "sombrero.png", "confeti.png"]
            },
            "modo-samain": {
                iconos: {
                    es: "calabazza.png",
                    en: "calabaza.png"
                },
                textos: {
                    es: "¡Feliz Samaín / Halloween!",
                    en: "Happy Samain / Halloween!"
                },
                particulas: ["calabaza.png", "fantasma.png", "araña.png", "rip.png"]
            }
        };

        // Para esta prueba está forzado en "modo-navidad" (puedes cambiarlo a "modo-sanjuan", etc. para probar los demás)
        const modoActivo = "modo-navidad";

        if (modoActivo && configuracionTemporadas[modoActivo]) {
            const config = configuracionTemporadas[modoActivo];
            
            const actualizarTextoTemporada = () => {
                if (detalleEl) {
                    const idiomaActual = obtenerEsIngles() ? "en" : "es";
                    detalleEl.innerHTML = "";

                    const archivoIcono = config.iconos ? config.iconos[idiomaActual] : config.icono;

                    if (archivoIcono) {
                        const imgIcono = document.createElement("img");
                        imgIcono.src = `img/${archivoIcono}`;
                        imgIcono.alt = "Icono temporada";
                        imgIcono.style.height = "1.2em";
                        imgIcono.style.verticalAlign = "middle";
                        detalleEl.appendChild(imgIcono);
                    }

                    const textoSpan = document.createElement("span");
                    textoSpan.textContent = config.textos[idiomaActual];
                    detalleEl.appendChild(textoSpan);
                }
            };

            actualizarTextoTemporada();

            let ultimoScroll = window.scrollY;
            let contadorScroll = 0;

            window.addEventListener("scroll", () => {
                const scrollActual = window.scrollY;

                if (scrollActual > ultimoScroll) {
                    contadorScroll++;
                    if (contadorScroll % 2 === 0) { // Genera una partícula cada 2 eventos de scroll
                        crearParticulaScroll(config.particulas);
                        crearParticulaScroll(config.particulas);
                    }
                }
                ultimoScroll = scrollActual;
            }, { passive: true });

            function crearParticulaScroll(listaRecursos) {
                const recurso = listaRecursos[Math.floor(Math.random() * listaRecursos.length)];
                
                const particula = document.createElement("img");
                particula.src = `img/${recurso}`;
                particula.className = "particula-scroll";
                particula.alt = "Decoración de temporada";

                const posX = Math.random() * (window.innerWidth - 50);
                const tamano = (Math.random() * 15 + 25).toFixed(0); // Entre 25px y 40px
                const duracion = (Math.random() * 800 + 1200).toFixed(0); // Entre 1.2s y 2s

                particula.style.left = `${posX}px`;
                particula.style.top = `-60px`;
                particula.style.width = `${tamano}px`;
                particula.style.height = "auto";
                particula.style.animationDuration = `${duracion}ms`;

                document.body.appendChild(particula);

                setTimeout(() => particula.remove(), parseInt(duracion));
            }
        }
    </script>
</body>
</html>
