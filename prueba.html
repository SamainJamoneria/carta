<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Modo Carnaval - Jamonería Samaín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 300vh;
            background: linear-gradient(to bottom, #2b1055, #7597de);
        }

        header {
            background-color: #1a102f;
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Contenedor principal de la temporada (oculto por defecto) */
        #contenedor-temporada {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        /* Se activa cuando el body tiene la clase */
        body.modo-carnaval #contenedor-temporada {
            display: flex;
        }

        /* Iconos fuera del texto: el triple de altura y animación flotante */
        .icono-temporada-grande {
            height: 3.5em;
            width: auto;
            object-fit: contain;
            animation: flotarIcono 3s ease-in-out infinite alternate;
            user-select: none;
            pointer-events: none;
        }

        @keyframes flotarIcono {
            0% { transform: translateY(0px) rotate(-8deg); }
            100% { transform: translateY(-6px) rotate(8deg); }
        }

        /* Contenedor exclusivo para el texto central de Carnaval */
        #detalle-temporada {
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        .contenido {
            padding: 60px 20px;
            text-align: center;
            color: #fff;
        }

        .particula-scroll {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: caidaParticula linear forwards;
            will-change: transform, opacity;
        }

        @keyframes caidaParticula {
            0% {
                opacity: 0;
                transform: translateY(-50px) scale(0.8) rotate(0deg);
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) scale(1.1) rotate(360deg);
            }
        }
    </style>
</head>
<body class="modo-carnaval">

    <header>
        <h1>Jamonería Samaín - Vista Previa Carnaval</h1>
        <div id="contenedor-temporada">
            <img id="icono-izq" class="icono-temporada-grande" alt="Icono carnaval">
            <div id="detalle-temporada"></div>
            <img id="icono-der" class="icono-temporada-grande" alt="Icono carnaval">
        </div>
    </header>

    <div class="contenido">
        <h2>👇 Haz scroll hacia abajo</h2>
        <p>Comprueba cómo quedan los iconos de Carnaval a los lados y las partículas cayendo.</p>
        <br><br><br>
        <p>Sigue haciendo scroll para ver el efecto continuo...</p>
    </div>

    <script>
        const body = document.body;
        const detalleEl = document.getElementById("detalle-temporada");
        const iconoIzqEl = document.getElementById("icono-izq");
        const iconoDerEl = document.getElementById("icono-der");

        const obtenerEsIngles = () => document.documentElement.lang === "en";

        const configuracionTemporadas = {
            "modo-carnaval": {
                icono: "bufon.png", // Asegúrate de tener este archivo en la raíz
                textos: {
                    es: "¡Disfruta del Carnaval de parte del equipo de Samaín!",
                    en: "Enjoy Carnival from the Samaín team!"
                },
                particulas: ["confeti.png", "mascara.png", "sombrero.png",] // Asegúrate de tener estos archivos en la raíz
            }
        };

        const modoActivo = "modo-carnaval";

        if (modoActivo && configuracionTemporadas[modoActivo]) {
            const config = configuracionTemporadas[modoActivo];
            
            const actualizarTextoTemporada = () => {
                const idiomaActual = obtenerEsIngles() ? "en" : "es";

                if (detalleEl) {
                    detalleEl.textContent = config.textos[idiomaActual];
                }

                const archivoIcono = config.icono;
                if (archivoIcono) {
                    if (iconoIzqEl) {
                        iconoIzqEl.src = `${archivoIcono}`;
                        iconoIzqEl.onerror = () => console.error("⚠️ No se pudo cargar el icono izquierdo: " + archivoIcono);
                    }
                    if (iconoDerEl) {
                        iconoDerEl.src = `${archivoIcono}`;
                        iconoDerEl.onerror = () => console.error("⚠️ No se pudo cargar el icono derecho: " + archivoIcono);
                    }
                }
            };

            actualizarTextoTemporada();

            let ultimoScroll = window.scrollY;
            let contadorScroll = 0;

            window.addEventListener("scroll", () => {
                const scrollActual = window.scrollY;

                if (scrollActual > ultimoScroll) {
                    contadorScroll++;
                    if (contadorScroll % 2 === 0) {
                        crearParticulaScroll(config.particulas);
                    }
                }
                ultimoScroll = scrollActual;
            }, { passive: true });

            function crearParticulaScroll(listaRecursos) {
                const recurso = listaRecursos[Math.floor(Math.random() * listaRecursos.length)];
                
                const particula = document.createElement("img");
                particula.src = `${recurso}`;
                particula.className = "particula-scroll";
                particula.alt = "Decoración carnaval";

                particula.onerror = () => {
                    console.error("⚠️ No se pudo cargar la partícula: " + recurso);
                };

                const posX = Math.random() * (window.innerWidth - 50);
                const tamano = (Math.random() * 15 + 25).toFixed(0);
                const duracion = (Math.random() * 800 + 1200).toFixed(0);

                particula.style.left = `${posX}px`;
                particula.style.top = `-60px`;
                particula.style.width = `${tamano}px`;
                particula.style.height = "auto";
                particula.style.animationDuration = `${duracion}ms`;

                document.body.appendChild(particula);

                setTimeout(() => particula.remove(), parseInt(duracion));
            }
        }
    </script>
</body>
</html>
