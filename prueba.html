<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Modo Navidad - Jamonería Samaín</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 300vh;
            background: linear-gradient(to bottom, #f5f7fa, #c3cfe2);
        }

        header {
            background-color: #1a252f;
            color: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #detalle-temporada {
            display: none; 
            margin: 12px auto 0;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            width: fit-content;
            align-items: center;
            gap: 8px;
        }

        body.modo-navidad #detalle-temporada {
            display: inline-flex;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .contenido {
            padding: 60px 20px;
            text-align: center;
            color: #333;
        }

        .particula-scroll {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            animation: caidaParticula linear forwards;
            will-change: transform, opacity;
        }

        @keyframes caidaParticula {
            0% {
                opacity: 0;
                transform: translateY(-50px) scale(0.8) rotate(0deg);
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(105vh) scale(1.1) rotate(360deg);
            }
        }
    </style>
</head>
<body class="modo-navidad">

    <header>
        <h1>Jamonería Samaín - Vista Previa Navidad</h1>
        <div id="detalle-temporada"></div>
    </header>

    <div class="contenido">
        <h2>👇 Mueve la rueda del ratón hacia abajo (Haz Scroll)</h2>
        <p>Se mostrará el icono de Papá Noel (santa.png) y lloverán las bolas reales de Navidad.</p>
        <br><br><br>
        <p>Sigue haciendo scroll para ver el efecto continuo...</p>
    </div>

    <script>
        const body = document.body;
        // CORREGIDO: Añadido "document." para que el selector funcione correctamente
        const detalleEl = document.getElementById("detalle-temporada");

        const obtenerEsIngles = () => document.documentElement.lang === "en";

        const configuracionTemporadas = {
            "modo-navidad": {
                icono: "santa.png",
                textos: {
                    es: "Felices Fiestas de parte del equipo de Samaín",
                    en: "Merry Christmas from the Samaín team"
                },
                particulas: ["bola_roja.png", "bola_amarilla.png", "bola_azul.png"]
            }
        };

        const modoActivo = "modo-navidad";

        if (modoActivo && configuracionTemporadas[modoActivo]) {
            const config = configuracionTemporadas[modoActivo];
            
            const actualizarTextoTemporada = () => {
                if (detalleEl) {
                    const idiomaActual = obtenerEsIngles() ? "en" : "es";
                    detalleEl.innerHTML = "";

                    const archivoIcono = config.icono;

                    if (archivoIcono) {
                        const imgIcono = document.createElement("img");
                       imgIcono.src = `${archivoIcono}`;
                        imgIcono.alt = "Icono temporada";
                        imgIcono.style.height = "1.2em";
                        imgIcono.style.verticalAlign = "middle";

                        imgIcono.onerror = () => {
                            console.error("⚠️ No se pudo cargar el icono: img/" + archivoIcono);
                        };

                        detalleEl.appendChild(imgIcono);
                    }

                    const textoSpan = document.createElement("span");
                    textoSpan.textContent = config.textos[idiomaActual];
                    detalleEl.appendChild(textoSpan);
                }
            };

            actualizarTextoTemporada();

            let ultimoScroll = window.scrollY;
            let contadorScroll = 0;

            window.addEventListener("scroll", () => {
                const scrollActual = window.scrollY;

                if (scrollActual > ultimoScroll) {
                    contadorScroll++;
                    if (contadorScroll % 2 === 0) {
                        crearParticulaScroll(config.particulas);
                    }
                }
                ultimoScroll = scrollActual;
            }, { passive: true });

            function crearParticulaScroll(listaRecursos) {
                const recurso = listaRecursos[Math.floor(Math.random() * listaRecursos.length)];
                
                const particula = document.createElement("img");
                particula.src = `img/${recurso}`;
                particula.className = "particula-scroll";
                particula.alt = "Decoración navideña";

                particula.onerror = () => {
                    console.error("⚠️ No se pudo cargar la partícula: img/" + recurso);
                };

                const posX = Math.random() * (window.innerWidth - 50);
                const tamano = (Math.random() * 15 + 25).toFixed(0);
                const duracion = (Math.random() * 800 + 1200).toFixed(0);

                particula.style.left = `${posX}px`;
                particula.style.top = `-60px`;
                particula.style.width = `${tamano}px`;
                particula.style.height = "auto";
                particula.style.animationDuration = `${duracion}ms`;

                document.body.appendChild(particula);

                setTimeout(() => particula.remove(), parseInt(duracion));
            }
        }
    </script>
</body>
</html>
